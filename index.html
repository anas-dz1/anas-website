<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقتي التعريفية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
background: linear-gradient(135deg, #2b1055, #7597de);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #3f6096;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(199, 80, 192, 0.4);
            border-color: #c850c0;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .title {
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .info-list {
            text-align: right;
            margin-bottom: 25px;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
        }
        .info-item {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .info-item:last-child {
            margin-bottom: 0;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            display: block;
            padding: 12px;
            background: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .link-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- اكتب اسمك هنا -->
        <h1>أنس بورنان</h1>
        
        <!-- السنة الدراسية 📚 -->
        <div class="title">رابعة متوسط </div>
        
        <!-- نبذة قصيرة عني -->
        <p>أنا أنس بورنان، طالب في السنة الرابعة متوسط. أحب البرمجة وتصميم المواقع والتكنولوجيا.</p>
        
        <!--  المعلومات عني -->
        <div class="info-list">
            <div class="info-item">📍 <b>البلد:</b> الجزائر</div>
<div class="info-item">📍 <b>المنطقة:</b> ولاية الجلفة</div>
            <div class="info-item">🚀 <b>المهارات:</b> HTML</div>
</div>

        <!-- رابط حسابي ديسكورد للتواصل -->
<div class="links">
    <a href="https://discord.com/users/1492524296453488801" target="_blank" class="link-btn">
        <span>ديسكوردي للتواصل</span>
        <img src="https://i.ibb.co/Z1BKCZbX/discord-icon.png" alt="شعار ديسكورد" class="discord-icon">
    </a>
</div>    </div>

</body>
</html>
